[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "the-a-team"
version = "0.1.0"
description = "Provider-agnostic multi-agent orchestration with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "openai>=2.0,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.16,<3",
]

[project.scripts]
the-a-team = "the_a_team.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

